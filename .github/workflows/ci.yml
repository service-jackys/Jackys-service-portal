name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jackys_service_portal
          POSTGRES_USER: jackys
          POSTGRES_PASSWORD: jackys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jackys -d jackys_service_portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jackys:jackys@localhost:5432/jackys_service_portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm audit --audit-level=high
